# Pipeline settings. Experiment configs in experiments/ override these per run.
# Model strings use LiteLLM format: "<provider>/<model>", e.g. "anthropic/...",
# "openai/...", "ollama/...". Switching provider = changing one line here.

llm:
  generator:
    model: null          # OPEN DECISION (needed by Phase 2) — set before running ask()
    temperature: 0.0     # OPEN DECISION (Phase 4): 0 → repeats measure provider nondeterminism
    max_tokens: 1024
    timeout_s: 60
    num_retries: 3
  judge:
    model: null          # OPEN DECISION (Phase 4) — must be a different model family than the generator
    temperature: 0.0
    max_tokens: 1024
    timeout_s: 60
    num_retries: 3

corpus:
  torch_version: "2.15.0"  # pinned release (PyPI 2026-10-28); git tag = v2.15.0
  torch_git_tag: v2.15.0
  # Commit the wheel was built from (torch.version.git_version = tag v2.15.0-rc10).
  # The final v2.15.0 tag (31a77fc) adds only a pyproject.toml lint change; docs are identical.
  torch_git_commit: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
  raw_dir: data/raw
  docs_base_url: https://docs.pytorch.org/docs/2.15/
  # API pages (paths under pytorch/docs/source). Each page's prose is indexed, and every
  # object it documents (autosummary / auto*) becomes its own API doc from local docstrings.
  api_pages:
    - torch.md            # top-level tensor ops
    - tensors.md          # torch.Tensor
    - nn.md
    - nn.functional.md
    - nn.init.md
    - optim.md
    - data.md             # torch.utils.data
    - autograd.md
  notes_glob: notes/*    # CUDA semantics, reproducibility, AMP, ... (.md and .rst)
  report_path: data/corpus/ingest_report.json
  docs_path: data/corpus/docs.jsonl
  chunks_path: data/corpus/chunks.jsonl
  manifest_path: data/corpus/manifest.json

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  index_path: data/index/chroma
  chunk_size_tokens: 512
  chunk_overlap_tokens: 64
  top_k: 5

paths:
  benchmark_dir: benchmark/v1
  reports_dir: reports
  query_log: data/logs/queries.jsonl
