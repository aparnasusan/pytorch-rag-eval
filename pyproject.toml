[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ragbench"
version = "0.1.0"
description = "RAG assistant over the PyTorch docs, plus an eval system that measures it on real developer questions."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 1: torch pinned to match config.yaml corpus.torch_version.
# Install the CPU build with:
#   pip install -e ".[ingest]" --extra-index-url https://download.pytorch.org/whl/cpu
ingest = [
    "torch==2.15.0",
    "numpy>=1.26",
    "docutils>=0.21",
    "tokenizers>=0.20",  # embedder's tokenizer for chunk token budgets
]
# Phase 2 / 5: retrieval stack (embeddings + reranker run locally)
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
# Phase 3: benchmark collection
collect = [
    "datasets>=2.20",
    "httpx>=0.27",
]
# Phase 4 / 5: stats and charts
eval = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
# Phase 3 / 7: labeling tool + demo
app = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real LLM provider (needs API keys; skipped by default)",
]
addopts = "-m 'not live'"
